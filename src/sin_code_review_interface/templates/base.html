<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SIN Code Review</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; }
        .review-list { list-style: none; padding: 0; }
        .review-item { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .review-item a { text-decoration: none; color: #0366d6; font-weight: 600; }
        .review-item .meta { color: #666; font-size: 0.9em; }
        .badge { padding: 2px 8px; border-radius: 12px; font-size: 0.75em; font-weight: 600; text-transform: uppercase; }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-approved { background: #d4edda; color: #155724; }
        .badge-request_changes { background: #f8d7da; color: #721c24; }
        .badge-comment { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SIN Code Reviews</h1>
        <ul class="review-list">
            {% for review in reviews %}
            <li class="review-item">
                <div>
                    <a href="/reviews/{{ review.id }}/ui">{{ review.title }}</a>
                    <div class="meta">by {{ review.author }} &middot; {{ review.files_changed|join(', ') }}</div>
                </div>
                <span class="badge badge-{{ review.status }}">{{ review.status }}</span>
            </li>
            {% else %}
            <li class="review-item">No reviews yet.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
