[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sin-code-review-interface"
version = "0.1.0"
description = "Human-Centered Review Interface for Agent-Generated Code"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "networkx>=3.2",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
vscode = ["pyright>=1.1", "python-lsp-server>=1.10"]
dev = ["pytest>=8.0"]

[project.scripts]
sin-review = "sin_code_review_interface.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
